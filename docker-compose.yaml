services:
  mysql:
    image: mysql:8.4
    container_name: hotel-mysql
    environment:
      MYSQL_DATABASE: hotel_booking_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [
        "CMD",
        "mysqladmin",
        "ping",
        "-h",
        "localhost",
        "-u",
        "root",
        "-proot_password"
      ]


volumes:
  mysql_data: